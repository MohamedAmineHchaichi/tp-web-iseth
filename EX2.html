<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Menu</title>
<style>
    h3 { text-align: center; }
    ul.niv1 { list-style-type: circle; }
    ul.niv2 { list-style-type: disc; }
    ol.niv3a { list-style-type: lower-alpha; }
    ol.niv3b { list-style-type: decimal; }
</style>
</head>
<body>
<fieldset>
    <h3>MENU</h3>
    <ul class="niv1">
        <li>Thé
            <ul class="niv2">
                <li>De Chine
                    <ol class="niv3a">
                        <li>Cerise</li>
                        <li>Raisin</li>
                    </ol>
                </li>
                <li>Vert</li>
            </ul>
        </li>
        <li>Café
            <ul class="niv2">
                <li>Noir
                    <ol class="niv3b">
                        <li>Sucré</li>
                        <li>Serré</li>
                    </ol>
                </li>
                <li>Au Lait</li>
            </ul>
        </li>
    </ul>
</fieldset>
</body>
</html>
