<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title> Exercice 1 TP 2 </title>
<style>
    ul { list-style-type: circle; }
    ol { list-style-type: upper-alpha; }
    /* Essais (question 4 et 5) : ul -> disc, square, none ; ol -> decimal, decimal-leading-zero, lower-alpha, lower-roman, upper-roman, none */
</style>
</head>
<body>
    <h1> Les listes </h1>
    <h2> Les listes non ordonnées </h2>
    <ul>
        <li> Elément 1 </li>
        <li> Elément 2 </li>
        <li> Elément 3 </li>
    </ul>

    <h2> Les listes ordonnées </h2>
    <ol>
        <li> Premier élément </li>
        <li> Deuxième élément </li>
    </ol>
</body>
</html>
